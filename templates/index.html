<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mente Mestra</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>

  <div class="app-shell">

    <!-- Barra lateral com histórico de conversas -->
    <aside class="sidebar-conversas">
      <div class="sidebar-header">
        <h2 id="btn-home" class="marca" title="Voltar para a home">
          <svg class="icone-quorum" viewBox="0 0 100 100" aria-hidden="true">
            <line x1="50" y1="50" x2="50" y2="18" />
            <line x1="50" y1="50" x2="77.7" y2="34" />
            <line x1="50" y1="50" x2="77.7" y2="66" />
            <line x1="50" y1="50" x2="50" y2="82" />
            <line x1="50" y1="50" x2="22.3" y2="66" />
            <line x1="50" y1="50" x2="22.3" y2="34" />
            <circle cx="50" cy="18" r="8" />
            <circle cx="77.7" cy="34" r="8" />
            <circle cx="77.7" cy="66" r="8" />
            <circle cx="50" cy="82" r="8" />
            <circle cx="22.3" cy="66" r="8" />
            <circle cx="22.3" cy="34" r="8" />
            <circle class="centro" cx="50" cy="50" r="16" />
          </svg>
          <span>Mente Mestra</span>
        </h2>
        <button id="btn-nova-conversa" class="btn-nova-conversa" title="Nova conversa">+</button>
      </div>
      <div class="sidebar-conversas-container">
        <p class="rotulo-secao">Histórico</p>
        <ul id="lista-conversas" class="lista-conversas"></ul>
      </div>
      <div class="sidebar-footer">
        <button id="btn-configuracoes" class="btn-configuracoes" title="Configurações">⚙️</button>
      </div>
    </aside>

    <!-- Área principal do chat -->
    <div class="chat-container vazio">

      <!-- Cabeçalho com título -->
      <header class="chat-header">
        <div class="header-info">
          <h1 id="chat-titulo">Mente Mestra</h1>
        </div>
      </header>

      <!-- Tela inicial (sem conversa aberta) -->
      <div class="tela-inicial">
        <svg class="icone-quorum tela-inicial-icone" viewBox="0 0 100 100" aria-hidden="true">
          <line x1="50" y1="50" x2="50" y2="18" />
          <line x1="50" y1="50" x2="77.7" y2="34" />
          <line x1="50" y1="50" x2="77.7" y2="66" />
          <line x1="50" y1="50" x2="50" y2="82" />
          <line x1="50" y1="50" x2="22.3" y2="66" />
          <line x1="50" y1="50" x2="22.3" y2="34" />
          <circle cx="50" cy="18" r="8" />
          <circle cx="77.7" cy="34" r="8" />
          <circle cx="77.7" cy="66" r="8" />
          <circle cx="50" cy="82" r="8" />
          <circle cx="22.3" cy="66" r="8" />
          <circle cx="22.3" cy="34" r="8" />
          <circle class="centro" cx="50" cy="50" r="16" />
        </svg>
        <h1 class="tela-inicial-titulo">Mente Mestra</h1>
        <p class="tela-inicial-subtitulo">Converse com seu conselho de IAs</p>
      </div>

      <!-- Painel de conversas -->
      <main id="turnos" class="chat-messages"></main>

      <!-- Painel de configurações (modal/overlay) -->
      <div id="painel-config" class="painel-config">
        <div class="config-header">
          <h3>Configurações</h3>
          <button id="btn-fechar-config" class="btn-fechar">×</button>
        </div>

        <div class="config-content">
          <div class="config-section">
            <label class="rotulo">Convocar conselheiros</label>
            <div class="chips" id="chips">
              {% for chave, c in consultores.items() %}
              <label class="chip chip-{{ chave }}">
                <input type="checkbox" value="{{ chave }}" checked>
                <span>{{ c.nome }}</span>
                <small>{{ c.empresa }}</small>
              </label>
              {% endfor %}
            </div>
            <div class="quorum-info">
              <span id="quorum" class="quorum">4 de 4 conselheiros convocados</span>
            </div>
          </div>

          <div class="config-section">
            <label class="chairman-toggle">
              <input type="checkbox" id="usar-chairman" checked>
              <span>Sintetizar em um parecer único</span>
            </label>
            <select id="quem-chairman" class="config-select">
              {% for chave, c in consultores.items() %}
              <option value="{{ chave }}" {% if chave == 'claude' %}selected{% endif %}>{{ c.nome }} como chairman</option>
              {% endfor %}
            </select>
          </div>

          <div class="config-section">
            <label class="socratica-toggle">
              <input type="checkbox" id="modo-socratico">
              <span>Modo Socrático (ensinar a pensar)</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Área de input no rodapé -->
      <footer class="chat-footer">
        <div class="input-card">
          <textarea
            id="ideia"
            class="chat-input"
            placeholder="Escreva sua pergunta ou ideia aqui..."
            rows="1"
          ></textarea>
          <div class="input-toolbar">
            <button id="btn-resumo-conselho" class="chip-toolbar" type="button" title="Configurar conselheiros">
              <span id="resumo-conselho">Conselheiros</span>
              <span class="chip-toolbar-seta">▾</span>
            </button>
            <button id="btn-enviar" class="btn-enviar" title="Enviar" aria-label="Enviar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5" />
                <path d="M6 11l6-6 6 6" />
              </svg>
            </button>
          </div>
        </div>
        <p class="footer-info">Roda localmente. Suas ideias vão direto da sua máquina para a API de cada empresa.</p>
      </footer>

    </div>

  </div>

  <!-- Overlay do painel de configurações -->
  <div id="config-overlay" class="config-overlay"></div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
